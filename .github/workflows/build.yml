name: Build, Test & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            name: win-x64
          - os: ubuntu-latest
            rid: linux-x64
            name: linux-x64
          - os: macos-latest
            rid: osx-arm64
            name: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore OsuLazerAudioExporter.sln

      - name: Run Unit Tests
        run: dotnet test OsuLazerAudioExporter.sln --no-restore --verbosity normal

      - name: Publish Single-File Binary (${{ matrix.rid }})
        run: |
          dotnet publish src/OsuLazerAudioExporter.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -o ./dist/${{ matrix.rid }}

      - name: Build Windows Installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        uses: julir/setup-innosetup-action@v2

      - name: Compile Installer Script
        if: matrix.os == 'windows-latest'
        run: iscc installer.iss

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.name }}
          path: |
            ./dist/${{ matrix.rid }}/*
            ./installer_output/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}